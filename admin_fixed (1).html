<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة Qmax & Salik</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{color-scheme:dark;--bg:#050914;--panel:#0c1628;--blue:#2f91ff;--line:#203a5d;--text:#eef6ff;--muted:#a8bbd3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#10294b 0,#050914 55%);color:var(--text);font-family:system-ui,Tahoma,Arial,sans-serif;min-height:100vh}.wrap{width:min(900px,calc(100% - 24px));margin:24px auto}header{text-align:center;padding:25px 10px}h1{margin:0}h1 span{color:#7ac5ff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}label{display:block;margin:10px 0 6px;color:#c9dcf3}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#071020;color:white;font:inherit}textarea{min-height:84px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:white;font:inherit;font-weight:800;cursor:pointer;margin:8px 4px 0 0}.btn.secondary{background:#20344f}.btn.danger{background:#a63245}.muted{color:var(--muted);font-size:14px;line-height:1.7}.hidden{display:none!important}.item{border:1px solid var(--line);padding:13px;border-radius:12px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}.item p{margin:4px 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.item .actions{flex-shrink:0}.message{padding:10px 12px;border-radius:9px;background:#10233d;color:#cbe6ff;white-space:pre-wrap;margin:10px 0}footer{text-align:center;color:var(--muted);padding:18px}footer strong{display:block;color:#7ac5ff;font-size:23px;letter-spacing:5px;margin-top:8px}@media(max-width:580px){.row{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.item .actions{display:flex;flex-wrap:wrap}}
</style></head><body><header><h1><span>Qmax &amp; Salik</span> — لوحة الإدارة</h1><p class="muted">إدارة السوفتوير والفلاشة واللودر وملفات القنوات</p></header><main class="wrap"><div id="message" class="message hidden"></div>
<section id="loginPanel" class="panel"><h2>تسجيل دخول المدير</h2><p class="muted">استخدم البريد وكلمة المرور لحساب المدير الذي أنشأته في Supabase Authentication.</p><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button id="login" class="btn">تسجيل الدخول</button></section>
<section id="appPanel" class="hidden"><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 id="formTitle">إضافة ملف جديد</h2><button id="logout" class="btn secondary">تسجيل الخروج</button></div><form id="modelForm"><input id="id" type="hidden"><label for="name">اسم الملف *</label><input id="name" required maxlength="180" placeholder="مثال: سوفتوير Qmax H7"><div class="row"><div><label for="model">الموديل</label><input id="model" maxlength="180" placeholder="مثال: Qmax H7"></div><div><label for="category">القسم الرئيسي *</label><select id="category" required><option value="software">السوفتوير</option><option value="flash">الفلاشة</option><option value="loader">اللودر</option><option value="channels">ملفات القنوات</option></select></div></div><label for="subcategory">القسم الفرعي</label><select id="subcategory"><option value="">بدون قسم فرعي</option></select><label for="description">الوصف</label><textarea id="description" placeholder="معلومات عن الملف أو الإصدار"></textarea><label for="download_url">رابط التحميل (MediaFire أو غيره) *</label><input id="download_url" type="url" required placeholder="https://www.mediafire.com/..."><label for="image_url">رابط الصورة (اختياري)</label><input id="image_url" type="url" placeholder="https://..."><label><input id="published" type="checkbox" checked style="width:auto;margin-left:8px"> منشور للزوار</label><button class="btn" type="submit">حفظ الملف</button><button class="btn secondary" type="button" id="reset">تفريغ الحقول</button></form></div><div class="panel"><h2>الملفات الموجودة</h2><input id="filter" type="search" placeholder="ابحث باسم الملف أو الموديل"><div id="items" class="muted">جاري التحميل...</div></div></section>
</main><footer><div>جميع الحقوق محفوظة — جمهورية كيوماكس ®</div><strong>MQX</strong></footer>
<script>
const SUPABASE_URL='https://xfdtstqdurvvajssuaju.supabase.co';
const SUPABASE_KEY='sb_publishable_s3NUp6hje1Y5CU0UHaVgmg_NLRiWjhD';
const $=id=>document.getElementById(id);const message=$('message');let db=null,allModels=[];
const subs={software:[['old','الشكل القديم'],['new','الشكل الجديد']],channels:[['DB','DB'],['SDX','SDX'],['Chmax','Chmax']],flash:[],loader:[]};const cats={software:'السوفتوير',flash:'الفلاشة',loader:'اللودر',channels:'ملفات القنوات'};
function note(t){message.textContent=t;message.classList.remove('hidden')}function clearNote(){message.classList.add('hidden');message.textContent=''}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setSubs(selected=''){const c=$('category').value;const list=subs[c]||[];$('subcategory').innerHTML='<option value="">بدون قسم فرعي</option>'+list.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');$('subcategory').value=selected}
function resetForm(){ $('modelForm').reset();$('id').value='';$('published').checked=true;$('formTitle').textContent='إضافة ملف جديد';setSubs();}
async function loadModels(){const {data,error}=await db.from('models').select('*').order('created_at',{ascending:false});if(error){note('تعذر تحميل الملفات: '+error.message);return}allModels=data||[];renderItems()}
function renderItems(){const q=$('filter').value.trim().toLowerCase();const rows=allModels.filter(m=>[m.name,m.model,m.description,m.category,m.subcategory].join(' ').toLowerCase().includes(q));$('items').innerHTML=rows.length?rows.map(m=>`<div class="item"><div><b>${esc(m.name)}</b><p>${esc(cats[m.category]||m.category)}${m.subcategory?' · '+esc(m.subcategory):''} · ${m.published?'منشور':'مخفي'}${m.model?' · '+esc(m.model):''}</p></div><div class="actions"><button class="btn secondary" data-edit="${m.id}">تعديل</button><button class="btn danger" data-delete="${m.id}">حذف</button></div></div>`).join(''):'لا توجد ملفات.'}
function editModel(id){const m=allModels.find(x=>String(x.id)===String(id));if(!m)return;$('id').value=m.id;$('name').value=m.name||'';$('model').value=m.model||'';$('category').value=m.category;setSubs(m.subcategory||'');$('description').value=m.description||'';$('download_url').value=m.download_url||'';$('image_url').value=m.image_url||'';$('published').checked=!!m.published;$('formTitle').textContent='تعديل الملف';window.scrollTo({top:0,behavior:'smooth'})}
async function boot(){try{if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL)){note('رابط Supabase غير صحيح. لازم ينتهي بـ .supabase.co فقط، من غير /rest/v1/.');return}if(SUPABASE_KEY.startsWith('PASTE_')){note('ضع المفتاح العام Publishable من إعدادات مشروع Supabase.');return}if(!window.supabase){note('تعذر تحميل مكتبة Supabase. تحقق من اتصال الإنترنت.');return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data,error}=await db.auth.getSession();if(error){note('تعذر الاتصال بـ Supabase: '+error.message);return}if(data.session)await checkAdmin();}catch(e){note('خطأ في إعداد Supabase: '+(e?.message||e))}}
async function checkAdmin(){const {data:{user}}=await db.auth.getUser();if(!user){$('loginPanel').classList.remove('hidden');$('appPanel').classList.add('hidden');return}const {data,error}=await db.from('site_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){note('الحساب مسجل الدخول لكنه ليس ضمن المدراء. أضف UUID الحساب إلى جدول site_admins حسب تعليمات README.');$('loginPanel').classList.remove('hidden');$('appPanel').classList.add('hidden');return}clearNote();$('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');await loadModels()}
$('login').addEventListener('click',async()=>{clearNote();if(!db){note('أكمل إعداد رابط Supabase والمفتاح العام أولًا.');return}const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){note('تعذر تسجيل الدخول: '+error.message);return}await checkAdmin()});$('logout').addEventListener('click',async()=>{await db.auth.signOut();$('appPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');note('تم تسجيل الخروج.')});$('category').addEventListener('change',()=>setSubs());$('reset').addEventListener('click',resetForm);$('filter').addEventListener('input',renderItems);
$('modelForm').addEventListener('submit',async e=>{e.preventDefault();clearNote();const row={name:$('name').value.trim(),model:$('model').value.trim(),category:$('category').value,subcategory:$('subcategory').value,description:$('description').value.trim(),download_url:$('download_url').value.trim(),image_url:$('image_url').value.trim(),published:$('published').checked};let result;const id=$('id').value;if(id)result=await db.from('models').update(row).eq('id',id);else result=await db.from('models').insert(row);if(result.error){note('فشل حفظ الملف: '+result.error.message);return}note('تم حفظ الملف بنجاح.');resetForm();await loadModels()});$('items').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]');if(edit){editModel(edit.dataset.edit);return}const del=e.target.closest('[data-delete]');if(del){const m=allModels.find(x=>String(x.id)===del.dataset.delete);if(!m||!confirm('متأكد إنك عايز تحذف الملف: '+m.name+'؟'))return;const {error}=await db.from('models').delete().eq('id',del.dataset.delete);if(error){note('فشل الحذف: '+error.message);return}note('تم حذف الملف.');await loadModels()}});
boot();
</script></body></html>
